; Production PHP runtime hardening for the FrankenPHP web image (LOW-2, 2026-09
; security audit). Laravel already turns display_errors off via APP_DEBUG=false
; at the framework layer; these are the php.ini-level defenses that hold even
; for a request that fails before Laravel finishes booting.

; No `X-Powered-By: PHP/8.4.x` — a version fingerprint costs an attacker nothing
; to read and this app gains nothing by sending it.
expose_php=Off

; Never render a PHP error/stack trace to the response body, regardless of
; APP_DEBUG. Errors still reach the configured log channel (log_errors stays on).
display_errors=Off
display_startup_errors=Off
html_errors=Off
