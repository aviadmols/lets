<!doctype html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PP-02 — בחירת אופן הרכישה — חד־פעמי או מנוי</title>

<!-- ===== the shop's own stylesheet(s), inlined verbatim ===== -->
<style>
/* ===== plugins/lets-payplus-woocommerce/assets/css/lets.css ===== */
/*
 * LETS — storefront widget styles (W11 P2). Token-driven, RTL-aware (inherits the
 * page's dir). No inline styles in the markup; classes only. The plugin owns these
 * styles (this is the plugin's own storefront asset, not the SaaS admin UI).
 */
/* Tokens are scoped to the widget's OWN elements, never :root. This stylesheet
   loads inside the merchant's theme, and a --lets-pp-* on :root is a global the
   theme did not ask for; more to the point, a theme that happens to use the same
   name would silently restyle our widget. Every selector in this file is
   .lets-pp* or .lets-loyalty-*, so matching on the class prefixes covers all of
   them and leaks none. */
[class*="lets-pp"],
[class*="lets-loyalty"] {
  --lets-pp-fg: #1a1a1a;
  --lets-pp-muted: #6b7280;
  --lets-pp-border: #d1d5db;
  --lets-pp-bg: #f9fafb;
  --lets-pp-accent: #111827;
  --lets-pp-err: #b91c1c;
  --lets-pp-ok: #047857;
  --lets-pp-radius: 8px;
}

.lets-pp {
  margin: 12px 0;
}

.lets-pp-open {
  display: inline-block;
  border: 1px solid var(--lets-pp-border);
  background: var(--lets-pp-bg);
  color: var(--lets-pp-fg);
  border-radius: var(--lets-pp-radius);
  padding: 10px 16px;
  font-size: 14px;
  cursor: pointer;
  margin-inline-end: 8px;
}

.lets-pp-open--subscribe {
  background: #fff;
}

/* The one-liner under "Subscribe & save" in the calculator panel. Its own class:
   .lets-pp-sub is the cart subscription-choice BOX further down, and the two
   used to share a name — which dressed this paragraph in a border it never
   asked for, and that box in 13px muted type. */
.lets-pp-sublabel {
  margin: 0 0 12px;
  font-size: 13px;
  color: var(--lets-pp-muted);
}

.lets-pp-panel {
  margin-top: 12px;
  border: 1px solid var(--lets-pp-border);
  border-radius: var(--lets-pp-radius);
  padding: 16px;
  max-width: 420px;
}

.lets-pp-title {
  margin: 0 0 12px;
  font-size: 16px;
  font-weight: 600;
}

.lets-pp-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  font-size: 14px;
}

.lets-pp-field input,
.lets-pp-field select {
  width: 120px;
  padding: 6px 8px;
  border: 1px solid var(--lets-pp-border);
  border-radius: 6px;
}

.lets-pp-schedule {
  margin: 12px 0;
  font-size: 14px;
}

.lets-pp-row {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  color: var(--lets-pp-muted);
}

.lets-pp-submit {
  width: 100%;
  border: 0;
  background: var(--lets-pp-accent);
  color: #fff;
  border-radius: var(--lets-pp-radius);
  padding: 12px 16px;
  font-size: 14px;
  cursor: pointer;
}

.lets-pp-submit:disabled {
  opacity: 0.6;
  cursor: default;
}

.lets-pp-error {
  margin: 10px 0 0;
  color: var(--lets-pp-err);
  font-size: 13px;
}

/* Thank-you post-purchase upsell. */
.lets-pp-upsell {
  margin: 16px 0;
}

.lets-pp-upsell-card {
  border: 1px solid var(--lets-pp-border);
  border-radius: var(--lets-pp-radius);
  padding: 16px;
  max-width: 420px;
}

.lets-pp-upsell-price {
  font-size: 18px;
  font-weight: 600;
  margin: 0 0 12px;
}

.lets-pp-decline {
  width: 100%;
  margin-top: 8px;
  border: 1px solid var(--lets-pp-border);
  background: #fff;
  color: var(--lets-pp-fg);
  border-radius: var(--lets-pp-radius);
  padding: 10px 16px;
  font-size: 13px;
  cursor: pointer;
}

.lets-pp-upsell-done {
  color: var(--lets-pp-ok, #047857);
  font-size: 14px;
  font-weight: 600;
}

/* W16 — product media + name on the thank-you upsell card (functional; the full
   redesign lands separately). */
.lets-pp-media {
  display: flex;
  justify-content: center;
  margin-bottom: 12px;
}
.lets-pp-img {
  max-width: 220px;
  max-height: 220px;
  width: auto;
  height: auto;
  border-radius: 12px;
  object-fit: cover;
}
.lets-pp-product {
  margin: 2px 0 6px;
  font-size: 14px;
  color: var(--lets-pp-muted, #6b7280);
}

/* W17 B — cart-based subscription choice on the product page. */
.lets-pp-sub {
  margin: 12px 0;
  padding: 12px 14px;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 8px;
}
.lets-pp-sub__label { margin: 0 0 8px; }
.lets-pp-sub__opt {
  display: block;
  margin: 6px 0;
  cursor: pointer;
}
.lets-pp-sub__opt input { margin-inline-end: 8px; }
.lets-pp-sub__note { margin: 0; font-weight: 600; }
.lets-pp-sub__cadence { opacity: 0.7; font-size: 0.9em; }

/* ==================== MEMBERS CLUB ([lets_loyalty]) ====================
   The iframe wrapper, and the signed-out prompt. The prompt is an invitation,
   not an error, so it reads like a small hero: a centred card, a heading, one
   line of copy, one button. The iframe's height is a floor — the club page
   reports its real height over postMessage and the script stretches it. */

.lets-loyalty-wrap {
  margin: 12px 0;
}

.lets-loyalty-frame {
  display: block;
  width: 100%;
  border: 0;
  /* Mirrors LETS_PAYPLUS_LOYALTY_MIN_HEIGHT until the page reports its own. */
  min-height: 900px;
}

.lets-loyalty-prompt {
  margin: 12px 0;
  padding: 44px 28px;
  text-align: center;
  border: 1px solid var(--lets-pp-border);
  border-radius: var(--lets-pp-radius);
  background: var(--lets-pp-bg);
}

.lets-loyalty-prompt h3 {
  margin: 0 0 8px;
  font-size: 22px;
  font-weight: 700;
  color: var(--lets-pp-fg);
}

.lets-loyalty-prompt p {
  margin: 0 auto 22px;
  max-width: 46ch;
  color: var(--lets-pp-muted);
  line-height: 1.6;
}

/* .button is WooCommerce's own class on the link, which keeps the prompt
   working with no stylesheet at all; these rules dress it in the widget's
   accent when the stylesheet IS there. */
.lets-loyalty-prompt .button {
  display: inline-block;
  padding: 11px 30px;
  border: 1px solid var(--lets-pp-accent);
  border-radius: var(--lets-pp-radius);
  background: var(--lets-pp-accent);
  color: #fff;
  text-decoration: none;
  transition: opacity 0.2s ease;
}

.lets-loyalty-prompt .button:hover {
  opacity: 0.85;
  color: #fff;
}

</style>

<style>
/* --- host page only: this is the sheet the element is pinned to, never
       part of the component. Delete it when you copy the markup out. --- */
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0 auto;
    padding: 40px clamp(16px, 4vw, 48px);
    /* A card shown edge to edge on a 2000px screen is not the card the shopper
       sees. Full-page specimens opt out with data-wide. */
    max-inline-size: 940px;
    background: #ffffff;
    color: #14161a;
    /* The account CSS carries no font-family on purpose — it inherits the
       merchant's theme. This stands in for that theme. */
    font-family: "Segoe UI", "Noto Sans Hebrew", Arial, system-ui, sans-serif;
    line-height: 1.55;
}
body[data-wide] { max-inline-size: 1480px; }
body[data-ground="dark"] { background: #0d0f12; color: #f3f4f6; }
body[data-ground="paper"] { background: #f4f5f7; }
/* Shown without WooCommerce's navigation beside it, so the shell is one column. */
.k-onecol { grid-template-columns: minmax(0, 1fr) !important; }
/* A toast is position:fixed in the shop; pinned here so it stays on the page. */
.k-pin .la-toast { position: static; transform: none; display: inline-block; }

/* --- specimen labels. On a plate that is a matrix of variants the label is
       half the information, so unlike the catalogue's captions these ship. --- */
.k-group {
    margin: 0 0 18px;
    padding-block-end: 8px;
    border-block-end: 1px solid rgba(128, 128, 128, 0.28);
    font-size: 0.8125rem;
    font-weight: 700;
    letter-spacing: 0.04em;
}
.k-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 28px 24px;
    align-items: start;
    margin-block-end: 44px;
}
.k-gallery:last-child { margin-block-end: 0; }
.k-item { min-inline-size: 0; }
.k-item--wide { grid-column: 1 / -1; }
.k-label {
    display: block;
    margin-block-end: 10px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.6875rem;
    letter-spacing: 0.06em;
    color: #8b929c;
}

/* --- tab scaffolding. In the shop each tab is its own page load; the sheet
       keeps them in one file so the screens can be browsed. Nothing here
       ships — .k-tab wrappers are the catalogue's, not the product's. --- */
.k-tab[hidden] { display: none; }
</style>
</head>
<body class="lets-el">

<div class="lets-pp-sub" data-lets-sub="" data-cadence="every month">
    <p class="lets-pp-sub__label">
        <strong>Choose how to buy</strong>
    </p>
    <label class="lets-pp-sub__opt">
        <input type="radio" name="k_purchase_mode_a" value="one_time">
        One-time purchase — ILS 199.00
    </label>
    <label class="lets-pp-sub__opt">
        <input type="radio" name="k_purchase_mode_a" value="subscribe" checked="">
        <span>
            Subscribe — ILS 149.00
            <span class="lets-pp-sub__cadence">every month</span>
        </span>
    </label>
</div>
<div class="lets-pp-sub" data-lets-sub="" data-cadence="every month">
    <p class="lets-pp-sub__note">
        Sold as a subscription — ILS 149.00
        <span class="lets-pp-sub__cadence">every month</span>
    </p>
</div>

</body>
</html>
