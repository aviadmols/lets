# The CUSTOM (stage-1) Partner app — "LETS Subscriptions".
#
# Deploy with:  shopify app deploy --config subscriptions
#
# DECISION (2026-07-26): ONE deployment serves BOTH Partner apps. There is no
# second Railway service, no second database, no second domain. Real test stores
# install through THIS app (custom distribution = install links, no App Store
# review) and get EVERYTHING — the PayPlus rail AND the Shopify-Payments
# subscriptions rail; the merchant picks the subscriptions engine per shop in
# Settings → Billing. The PUBLIC app's config (shopify.app.toml) stays untouched
# until App Store submission, and its scopes stay minimal.
#
# The backend resolves identities per shop (shops.shopify_app_key + ShopifyApps):
# OAuth, token exchange, session-token `aud`, webhook HMAC and App Bridge all
# work for both apps on the same URL. This app's credentials live in the SAME
# service env as the public ones: SHOPIFY_CUSTOM_API_KEY / SHOPIFY_CUSTOM_API_SECRET.
#
# client_id is a PLACEHOLDER until the owner creates the custom Partner app
# (Custom distribution — an IRREVERSIBLE choice for that app record, which is
# exactly why it is NOT the public LETS app) and Shopify approves the
# protected-data + subscription scopes (up to 7 business days).
#
# Scope map (every scope ↔ a real call in this codebase):
#   the public set (orders/draft orders/customers/products/fulfillments) →
#     the ported PayPlus engine: order strategy, sync, fulfillment lock
#   read/write_own_subscription_contracts → ContractActionService mutations,
#     ContractMirror reads, BillingAttemptJob's subscriptionBillingAttemptCreate
#   read_customer_payment_methods         → required by the Subscription APIs
#   write_products                        → SellingPlanService (selling plan groups)
#   read_all_orders                       → billing-attempt orders + history
#   read_checkout_external_data           → subscriptions checkout requirement
#   customer-account extension reads use the Customer Account API scopes
#     (customer_read/write_own_subscription_contracts), granted alongside.

name = "LETS Subscriptions"
handle = "lets-subscriptions"
client_id = "5d53c39c30da6f911c6634071fbcd7a4"  # API key for the CUSTOM app (org 128972608) — public, not a secret
application_url = "https://app.lets.co.il"
embedded = true

# Which extensions this app ships. NOT the default (all of extensions/*) because
# a version only releases if EVERY extension in it can be released, so one that
# is still waiting on an approval would hold back the other three.
#
# `network_access` (which lets-thank-you and lets-subscriptions-account both
# declare) was the shared blocker. GRANTED 2026-07-28 — "Checkout and account UI
# extensions are enabled" in the Partner Dashboard — so lets-thank-you ships now.
#
# lets-subscriptions-account also needed the subscription scopes for its
# Customer Account API reads. GRANTED the same day, so all four ship.
#
# Shipping lets-thank-you is about the APP, not this one store: it charges a
# saved PayPlus token, which the pilot store — billing through Shopify Payments —
# has no use for, but any PayPlus merchant installing through this app does.
#
# The list is now the same four the public app (shopify.app.toml) ships by
# default; it stays explicit so that adding a fifth extension is a decision here
# rather than a side effect of creating a directory.
extension_directories = [
  "extensions/lets-installments",
  "extensions/lets-post-purchase",
  "extensions/lets-thank-you",
  "extensions/lets-subscriptions-account",
]

[access_scopes]
# Declaring a scope the app has NOT been approved for makes Shopify reject the
# whole version, so this list may only ever contain what is actually granted.
# Keep in lockstep with config('shopify.apps.custom.oauth_scopes').
#
# The subscription scopes were rejected here on 2026-07-26 ("app_access /
# Validation errors: scopes"), which is exactly what being gated behind an
# API-access request looks like from the code side. GRANTED 2026-07-28 —
# "Access subscriptions APIs" and "Read all orders scope" both approved in the
# Partner Dashboard — so the four now appear for the first time:
#   read_own_subscription_contracts   → ContractMirror + ContractBackfill reads
#   write_own_subscription_contracts  → ContractActionService pause/resume/cancel
#   read_customer_payment_methods     → required BY the Subscription APIs to bill
#   read_all_orders                   → billing-attempt orders past the 60-day
#                                       window read_orders covers
#
# read_checkout_external_data stays OUT: neither approval covers it, and one
# unapproved scope rejects the entire version — so it is not worth carrying for a
# call this app does not yet make.
#
# read/write_purchase_options remains what actually creates SELLING PLANS, and is
# NOT gated — Shopify's own error names it as the alternative to
# write_own_subscription_contracts:
#   "Required access: write_products as well as any of
#    write_own_subscription_contracts, write_purchase_options"
# which is how products were made subscribable before this approval landed.
#
# NOTE: this list is now WIDER than the installed store granted, so the merchant
# is asked to re-authorise on the next embedded load. That prompt is the point —
# it is what re-mints the token with the subscription scopes.
scopes = "read_customers,write_customers,read_products,write_products,read_purchase_options,write_purchase_options,write_orders,read_all_orders,write_draft_orders,write_fulfillments,write_merchant_managed_fulfillment_orders,read_own_subscription_contracts,write_own_subscription_contracts,read_customer_payment_methods"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://app.lets.co.il/shopify/callback",
]

[webhooks]
api_version = "2026-04"

  # Everything lands on the ONE platform webhook endpoint; VerifyShopifyWebhook
  # proves the HMAC against EVERY configured app secret, WebhookController
  # resolves the shop, WebhookRouter dispatches by topic.
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/shopify/webhooks"

  # Catalog sync — keep the local products cache fresh.
  [[webhooks.subscriptions]]
  topics = ["products/create", "products/update", "products/delete"]
  uri = "/shopify/webhooks"

  # The Shopify-Payments rail. Declared here as well as registered per-shop
  # (RegisterShopifyWebhooksJob) — belt and braces: the toml makes Shopify
  # VALIDATE the topics at deploy, the per-shop registration makes them exist for
  # a given store the moment it installs.
  #
  # Was rejected outright until 2026-07-28 ("not approved to subscribe to webhook
  # topics containing protected customer data") and unblocked by the "Access
  # subscriptions APIs" grant. These are what keep the mirror honest after the
  # one-time ContractBackfill: a webhook announces a CHANGE, the backfill covers
  # what predates it, and neither substitutes for the other.
  [[webhooks.subscriptions]]
  topics = [
    "subscription_contracts/create", "subscription_contracts/update",
    "subscription_billing_attempts/success", "subscription_billing_attempts/failure",
    "subscription_billing_attempts/challenged",
  ]
  uri = "/shopify/webhooks"
  #
  # [[webhooks.subscriptions]]
  # compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  # uri = "/shopify/webhooks"

[app_proxy]
# Storefront → backend trust boundary (installments button + the thank-you /
# order-status upsell widget), identical to the public app's so the SAME
# storefront paths work on a store installed through either app.
url = "https://app.lets.co.il/proxy"
subpath = "payplus"
prefix = "apps"

[pos]
embedded = false
